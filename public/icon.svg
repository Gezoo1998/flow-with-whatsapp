<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Inner Sphere Glow -->
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Backplate -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Ambient Radial Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#inner-glow)" />

  <!-- Outer Glassmorphic Dashed Circle Frame -->
  <circle 
    cx="256" 
    cy="256" 
    r="140" 
    fill="none" 
    stroke="url(#accent-grad)" 
    stroke-width="10" 
    stroke-linecap="round" 
    stroke-dasharray="24 16"
    filter="url(#glow)"
    opacity="0.9"
  />

  <!-- Secondary Inner Rings -->
  <circle 
    cx="256" 
    cy="256" 
    r="105" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="3" 
    stroke-linecap="round" 
    opacity="0.15"
  />

  <!-- Central Solid Glowing Medallion (CenterFlow Brand Core) -->
  <circle 
    cx="256" 
    cy="256" 
    r="75" 
    fill="#ffffff" 
    fill-opacity="0.04"
    stroke="url(#accent-grad)"
    stroke-width="8"
    filter="url(#shadow)"
  />

  <!-- CenterFlow Solid Central Node -->
  <circle 
    cx="256" 
    cy="256" 
    r="40" 
    fill="url(#accent-grad)" 
    filter="url(#glow)"
  />

  <!-- Intersecting Professional Crosshair Indicators -->
  <path 
    d="M 196 256 L 316 256 M 256 196 L 256 316" 
    stroke="#ffffff" 
    stroke-width="8" 
    stroke-linecap="round" 
    opacity="0.95"
  />

  <!-- Embedded Premium Dot Accents -->
  <circle cx="256" cy="115" r="8" fill="#ec4899" />
  <circle cx="256" cy="397" r="8" fill="#3b82f6" />
  <circle cx="115" cy="256" r="8" fill="#3b82f6" />
  <circle cx="397" cy="256" r="8" fill="#ec4899" />
</svg>
